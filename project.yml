name: Pribye
options:
  bundleIdPrefix: com.pribye
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_LANGUAGE: ja
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2QA6W85W3D
    ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
    ADMOB_BANNER_AD_UNIT_ID: "ca-app-pub-3940256099942544/2435281174"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.5.0"
  LiteRTLM:
    path: Vendor/LiteRT-LM
targets:
  Pribye:
    type: application
    platform: iOS
    sources:
      - path: Pribye
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pribye.app
        INFOPLIST_FILE: Pribye/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: LiteRTLM
        product: LiteRTLM
    scheme:
      testTargets:
        - PribyeTests
  PribyeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PribyeTests
    dependencies:
      - target: Pribye
