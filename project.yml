name: Pribye
options:
  bundleIdPrefix: com.pribye
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2QA6W85W3D
packages: {}
targets:
  Pribye:
    type: application
    platform: iOS
    sources:
      - path: Pribye
        excludes:
          - Resources/**
    resources:
      - path: Pribye/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pribye.app
        INFOPLIST_FILE: Pribye/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - PribyeTests
  PribyeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PribyeTests
    dependencies:
      - target: Pribye
