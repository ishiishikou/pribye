name: iOS

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -1)
          if [ -z "$XCODE_PATH" ]; then XCODE_PATH=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          DEVICE_ID=$(xcodebuild -showdestinations -project Pribye.xcodeproj -scheme Pribye | awk -F 'id:' '/platform:iOS Simulator/ && /name:iPhone/ { split($2, parts, ","); print parts[1]; exit }')
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone Simulator destination found."
            xcodebuild -showdestinations -project Pribye.xcodeproj -scheme Pribye
            exit 1
          fi
          xcodebuild test \
            -project Pribye.xcodeproj \
            -scheme Pribye \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
