name: iOS

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    env:
      LITERT_LM_VERSION: v0.14.0
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -1)
          if [ -z "$XCODE_PATH" ]; then XCODE_PATH=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Clone LiteRT-LM without Git LFS binaries
        run: |
          mkdir -p Vendor
          GIT_LFS_SKIP_SMUDGE=1 git clone \
            --depth 1 \
            --branch "$LITERT_LM_VERSION" \
            --single-branch \
            https://github.com/google-ai-edge/LiteRT-LM.git \
            Vendor/LiteRT-LM
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild test \
            -project Pribye.xcodeproj \
            -scheme Pribye \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO
