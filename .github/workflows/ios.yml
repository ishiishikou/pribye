name: iOS

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    env:
      LITERT_LM_VERSION: v0.14.0
      LITERT_LM_IOS_CHECKSUM: dddac2f6713ed65eaf01c18e115d9fec22184adf575cc7856a21387e8ba937e1
      LITERT_LM_MAC_CHECKSUM: 450615483509aaa6d34b321fdc6862e41a224b674468ab10aff64ebe113d21b7
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -1)
          if [ -z "$XCODE_PATH" ]; then XCODE_PATH=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare LiteRT-LM package
        run: |
          mkdir -p Vendor
          GIT_LFS_SKIP_SMUDGE=1 git clone \
            --depth 1 \
            --branch "$LITERT_LM_VERSION" \
            --single-branch \
            https://github.com/google-ai-edge/LiteRT-LM.git \
            Vendor/LiteRT-LM

          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("Vendor/LiteRT-LM/Package.swift")
          contents = manifest.read_text(encoding="utf-8")
          replacements = {
              "4a4bdb0e89689ceacc54c2fb7ae0efe8f5dad2404110976a29c3bf6b374a511e": os.environ["LITERT_LM_IOS_CHECKSUM"],
              "13e818c9d3987afa87f0716884ebf0b6b10677b480717b8b098146e6b4f45847": os.environ["LITERT_LM_MAC_CHECKSUM"],
          }
          for old_checksum, new_checksum in replacements.items():
              if contents.count(old_checksum) != 1:
                  raise SystemExit(f"Expected LiteRT-LM checksum not found exactly once: {old_checksum}")
              contents = contents.replace(old_checksum, new_checksum)
          manifest.write_text(contents, encoding="utf-8")
          PY
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild test \
            -project Pribye.xcodeproj \
            -scheme Pribye \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO
